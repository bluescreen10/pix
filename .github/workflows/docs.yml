name: Docs

# The site is published in two versions: dev, built from main, and latest, built from
# the newest v* tag. Every run rebuilds both, because a Pages deployment replaces the
# whole site.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # tags are needed to find latest

      # Hugo fetches its theme as a Go module.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo
        run: |
          curl -sSfL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # A tag older than the site itself has no site/ directory; latest then falls back
      # to main, so the link never 404s.
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          build_site() {
            source="$1"
            version="$2"
            hugo --source "$source" --destination "$PWD/public/$version" \
              --baseURL "$BASE_URL/$version/" --minify
          }

          build_site site dev

          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$latest_tag" ] && git cat-file -e "$latest_tag:site/hugo.toml" 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/latest" "$latest_tag"
            build_site "$RUNNER_TEMP/latest/site" latest
          else
            build_site site latest
          fi

          cat > public/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=latest/">
          <link rel="canonical" href="$BASE_URL/latest/">
          <a href="latest/">pix documentation</a>
          EOF

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
